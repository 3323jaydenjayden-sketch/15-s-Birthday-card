<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthday! - Stella</title>
    <style>
        @import url('https://googleapis.com');
        body { margin: 0; background: #1a1a24; color: #fff; font-family: "Playfair Display", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; transition: background 2s; }
        body.active { background: linear-gradient(to bottom, #141124, #2a1b40, #43254f); }
        .frame { position: fixed; top: 25px; left: 25px; right: 25px; bottom: 25px; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; z-index: 5; }
        .container { text-align: center; z-index: 10; display: flex; flex-direction: column; align-items: center; transition: all 0.8s; }
        .fade-out { opacity: 0 !important; pointer-events: none; transform: translateY(-20px); }
        .cake { position: relative; width: 180px; height: 160px; margin-bottom: 20px; }
        .plate { position: absolute; bottom: 10px; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
        .layer { position: absolute; background: #4a3525; border-radius: 8px 8px 0 0; transform-origin: bottom center; }
        .cream { position: absolute; top: 0; left: 0; width: 100%; height: 12px; background: #fff5eb; border-radius: 8px 8px 0 0; }
        .cream::after { content: ''; position: absolute; top: 12px; left: 0; width: 100%; height: 6px; background-image: radial-gradient(circle at 50% -4px, #fff5eb 8px, transparent 9px); background-size: 16px 20px; }
        .l1 { bottom: 14px; left: 10px; width: 160px; height: 42px; animation: d 0.7s cubic-bezier(0.28, 0.84, 0.42, 1.4) forwards 0.4s; opacity: 0; }
        .l2 { bottom: 56px; left: 25px; width: 130px; height: 36px; animation: d 0.7s cubic-bezier(0.28, 0.84, 0.42, 1.4) forwards 0.9s; opacity: 0; }
        .l3 { bottom: 92px; left: 40px; width: 100px; height: 32px; animation: d 0.7s cubic-bezier(0.28, 0.84, 0.42, 1.4) forwards 1.4s; opacity: 0; }
        .candle { position: absolute; bottom: 124px; left: 86px; width: 8px; height: 26px; background: #ffb3c1; border-radius: 2px; opacity: 0; animation: f 0.4s forwards 2.0s; }
        .flame { position: absolute; top: -14px; left: -2px; width: 12px; height: 16px; background: linear-gradient(#ffd166, #ff6b6b); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 10px #ffd166; transform: scale(0); transform-origin: bottom center; transition: transform 0.5s; }
        .flame.ignite { transform: scale(1); animation: p 0.1s infinite alternate; }
        h1 { font-size: 1.8rem; font-weight: 400; font-style: italic; letter-spacing: 2px; margin: 10px 0; min-height: 4.5rem; line-height: 1.6; }
        .btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #ccc; padding: 10px 24px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; opacity: 0; transition: all 0.5s; font-family: inherit; }
        .btn.show { opacity: 1; animation: bP 2s infinite; }
        .secret-box { position: absolute; max-width: 320px; text-align: center; font-size: 1.1rem; line-height: 2; color: #fff5eb; letter-spacing: 2px; opacity: 0; transform: translateY(30px); transition: all 1.5s ease; pointer-events: none; z-index: 15; }
        .secret-box.reveal { opacity: 1; transform: translateY(0); }
        .ask-btns { display: flex; justify-content: center; gap: 40px; margin-top: 30px; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        .ask-btns.show { opacity: 1; pointer-events: auto; }
        .choice-btn { padding: 8px 24px; font-size: 0.95rem; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; min-width: 70px; }
        .btn-yes { background: #ff6b6b; border: 1px solid #ff6b6b; color: white; box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
        .btn-no { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #ccc; position: relative; transition: transform 0.15s ease; }

        /* 純 CSS 動態產生物件樣式 */
        .p, .bal, .hrt { position: fixed; pointer-events: none; z-index: 3; }
        .p { border-radius: 50%; animation: pF 1.2s ease-out forwards; }
        .bal { bottom: -120px; border-radius: 50%/40% 40% 60% 60%; animation: floatB 10s linear forwards; }
        .bal::after { content: ''; position: absolute; bottom: -12px; left: 50%; width: 1px; height: 14px; background: rgba(255,255,255,0.2); }
        .hrt { font-size: 24px; bottom: -50px; animation: floatB 6s ease-in forwards; }

        @keyframes d { 0% { transform: translateY(-120px) scaleY(1.4) scaleX(0.8); opacity: 0; } 50% { transform: translateY(0) scaleY(0.75) scaleX(1.15); opacity: 1; } 75% { transform: translateY(-8px) scaleY(1.08) scaleX(0.95); } 100% { transform: translateY(0) scaleY(1) scaleX(1); opacity: 1; } }
        @keyframes f { to { opacity: 1; } }
        @keyframes p { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg) scale(1.08); } }
        @keyframes bP { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.1); } 70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
        @keyframes floatB { 0% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-60vh) translateX(20px); } 100% { transform: translateY(-125vh) translateX(-15px); opacity: 0; } }
        @keyframes pF { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; } }
    </style>
</head>
<body>
    <div class="frame"></div>
    <div class="container" id="mainCard">
        <div class="cake">
            <div class="plate"></div>
            <div class="layer l1"><div class="cream"></div></div>
            <div class="layer l2"><div class="cream"></div></div>
            <div class="layer l3"><div class="cream"></div></div>
            <div class="candle"><div class="flame" id="cakeFlame"></div></div>
        </div>
        <div><h1 id="txt"></h1><button class="btn" id="btn" onclick="go()">點擊有驚喜 </button></div>
    </div>
    <div class="secret-box" id="secretBox"><div id="askText"></div><div class="ask-btns" id="btnGroup"><button class="choice-btn btn-yes" onclick="selectYes()">Yes</button><button class="choice-btn btn-no" id="noBtn" onmouseover="escapeNo()" ontouchstart="escapeNo()">No</button></div></div>
    <script>
        window.addEventListener('mousemove', (e) => {
            for(let i=0; i<2; i++) mkP(e.clientX, e.clientY, (Math.random()-0.5)*40, (Math.random()-0.5)*40+20, 'rgba(255,245,235,0.5)', Math.random()*3+1);
        });
        function mkP(x, y, mx, my, bg, sz) {
            const d = document.createElement('div'); d.className = 'p'; d.style.left = x+'px'; d.style.top = y+'px'; d.style.width = sz+'px'; d.style.height = sz+'px'; d.style.background = bg; d.style.setProperty('--mx', mx+'px'); d.style.setProperty('--my', my+'px'); document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
        }
        function mkBal(isC) {
            const b = document.createElement('div'); b.className = 'bal'; const s = Math.random()*24+20; b.style.width = s+'px'; b.style.height = (s*1.25)+'px'; b.style.left = Math.random()*90+5+'vw';
            b.style.background = isC ? ['rgba(255,179,193,0.5)','rgba(255,255,255,0.4)','rgba(162,210,255,0.4)'][Math.floor(Math.random()*3)] : ['rgba(255,179,193,0.2)','rgba(255,255,255,0.15)'][Math.floor(Math.random()*2)];
            const d = Math.random()*5+(isC?6:12); b.style.animationDuration = d+'s'; document.body.appendChild(b); setTimeout(() => b.remove(), d*1000);
        }
        const bTimer = setInterval(() => mkBal(false), 3500);
        function go() {
            clearInterval(bTimer); document.body.classList.add('active'); document.getElementById('mainCard').classList.add('fade-out');
            for (let i = 0; i < 60; i++) { let a = Math.random()*Math.PI*2, sp = Math.random()*150+50; mkP(window.innerWidth/2, window.innerHeight/2, Math.cos(a)*sp, Math.sin(a)*sp, ['#fff','#fff5eb','#ffb3c1','#ffd166'][Math.floor(Math.random()*4)], Math.random()*4+2); }
            for (let i = 0; i < 10; i++) setTimeout(() => mkBal(true), i*150);
            setInterval(() => mkBal(true), 1200);
            setTimeout(() => { document.getElementById('secretBox').classList.add('reveal'); type(document.getElementById('askText'), "劉芯慈，在這個特別的日子裡，\n我其實...已經喜歡妳很久了....\n\n妳...願意跟我在一起嗎？", () => { document.getElementById('btnGroup').classList.add('show'); }, 80); }, 800);
        }
        function escapeNo() { const btn = document.getElementById('noBtn'); const x = Math.random()*(window.innerWidth-120)-(window.innerWidth/2-60), y = Math.random()*(window.innerHeight-80)-(window.innerHeight/2-40); btn.style.transform = `translate(${x}px, ${y}px)`; }
        function selectYes() {
            document.getElementById('btnGroup').classList.remove('show'); type(document.getElementById('askText'), "❤️ 妳答應了！ 🥳\n\n謝謝妳，芯慈。\n未來的每一天，\n換我來一直一直對妳好。", null, 80);
            setInterval(() => { const h = document.createElement('div'); h.className = 'hrt'; h.innerHTML = '❤️'; h.style.left = Math.random()*90+5+'vw'; h.style.animationDuration = (Math.random()*2+4)+'s'; document.body.appendChild(h); setTimeout(() => h.remove(), 6000); }, 200);
        }
        function type(el, txt, cb, sp=120) { let i = 0; function t() { if(i < txt.length) { el.innerHTML = txt.substring(0, i+1).replace(/\n/g, '<br>')+'|'; i++; setTimeout(t, sp); } else { el.innerHTML = txt.replace(/\n/g, '<br>'); if(cb) cb(); } } t(); }
        setTimeout(() => { type(document.getElementById('txt'), "happy birthday!\n劉芯慈", () => { document.getElementById('cakeFlame').classList.add('ignite'); document.getElementById('btn').classList.add('show'); }); }, 2300);
    </script>
</body>
</html>
