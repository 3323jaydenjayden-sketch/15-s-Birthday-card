<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 15px;
        }

        .card.open {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background: #ffffff;
            color: #ff6f61;
        }

        .card-front h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .card-front p {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
        }

        .hint {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #999;
            animation: bounce 1.5s infinite;
        }

        .card-inside {
            background: #fff8f8;
            color: #333;
            transform: rotateY(180deg);
        }

        .card-inside h2 {
            color: #ff6f61;
            margin-top: 0;
        }

        .card-inside p {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
        }

        .signature {
            margin-top: 30px;
            font-weight: bold;
            color: #ff6f61;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card" id="birthdayCard" onclick="toggleCard()">
            <!-- 卡片正面 -->
            <div class="card-face card-front">
                <h1>🎉 生日快樂 🎂</h1>
                <p>Happy Birthday!</p>
                <div class="hint">👆 點擊卡片翻開祝福</div>
            </div>
            <!-- 卡片背面/內页 -->
            <div class="card-face card-inside">
                <h2>致 親愛的朋友：</h2>
                <p>
                    在這個特別的日子裡，<br>
                    祝你每一天都充滿歡笑、陽光與幸福。<br>
                    願你所有的夢想與願望都能成真！
                </p>
                <div class="signature">祝好，好友上</div>
            </div>
        </div>
    </div>

    <script>
        function toggleCard() {
            const card = document.getElementById('birthdayCard');
            card.classList.toggle('open');
        }
    </script>

</body>
</html>
